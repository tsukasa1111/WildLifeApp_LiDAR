name: iOS build

on:
  push:
    branches: ["audit/footprint27", "main"]
  pull_request:
    branches: ["main"]

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
      - name: Build for iOS Simulator
        run: |
          xcodebuild \
            -project FootprintCapture27/GuidedCaptureSample.xcodeproj \
            -scheme GuidedCaptureSample \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath "$RUNNER_TEMP/DerivedData" \
            CODE_SIGNING_ALLOWED=NO build
