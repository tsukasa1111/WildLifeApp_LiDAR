name: iOS build

on:
  push:
    branches: ["audit/footprint27", "main"]
  pull_request:
    branches: ["main"]

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
      - name: Build for iOS Simulator
        run: |
          xcodebuild \
            -project FootprintCapture27/GuidedCaptureSample.xcodeproj \
            -scheme GuidedCaptureSample \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath "$RUNNER_TEMP/DerivedData" \
            build-for-testing
      - name: Launch gallery in Simulator
        run: |
          SIMULATOR_ID=$(xcrun simctl list devices available -j | python3 -c 'import json,sys; devices=json.load(sys.stdin)["devices"]; print(next((device["udid"] for group in devices.values() for device in group if device.get("isAvailable") and "iPhone" in device["name"]), ""))')
          test -n "$SIMULATOR_ID"
          xcrun simctl boot "$SIMULATOR_ID" || true
          xcrun simctl bootstatus "$SIMULATOR_ID" -b
          APP_PATH="$RUNNER_TEMP/DerivedData/Build/Products/Debug-iphonesimulator/GuidedCaptureSample.app"
          xcrun simctl install "$SIMULATOR_ID" "$APP_PATH"
          BUNDLE_ID=$(/usr/libexec/PlistBuddy -c 'Print CFBundleIdentifier' "$APP_PATH/Info.plist")
          xcrun simctl privacy "$SIMULATOR_ID" grant location "$BUNDLE_ID" || true
          xcrun simctl launch "$SIMULATOR_ID" "$BUNDLE_ID"
          sleep 8
          xcrun simctl io "$SIMULATOR_ID" screenshot "$RUNNER_TEMP/ui-smoke.png"
          DATA_CONTAINER=$(xcrun simctl get_app_container "$SIMULATOR_ID" "$BUNDLE_ID" data)
          FIXTURE_FOLDER="$DATA_CONTAINER/Documents/$(date -u '+%Y-%m-%dT%H:%M:%SZ')-ci-fixture"
          mkdir -p "$FIXTURE_FOLDER/Images"
          cp "FootprintCapture27/GuidedCaptureSample/Assets.xcassets/AppIcon.appiconset/appstore.png" "$FIXTURE_FOLDER/Images/IMG_0001.png"
          cat > "$FIXTURE_FOLDER/metadata.json" <<'JSON'
          {"animalType":"シカ","hasFootprint":true,"traceType":"足跡","timestamp":1794911460}
          JSON
          xcrun simctl terminate "$SIMULATOR_ID" "$BUNDLE_ID"
          xcrun simctl launch "$SIMULATOR_ID" "$BUNDLE_ID"
          sleep 5
          xcrun simctl io "$SIMULATOR_ID" screenshot "$RUNNER_TEMP/ui-gallery-item.png"
          xcrun simctl terminate "$SIMULATOR_ID" "$BUNDLE_ID"
          xcodebuild -project FootprintCapture27/GuidedCaptureSample.xcodeproj \
            -scheme GuidedCaptureSample -destination "platform=iOS Simulator,id=$SIMULATOR_ID" \
            -derivedDataPath "$RUNNER_TEMP/DerivedData" -parallel-testing-enabled NO \
            -resultBundlePath "$RUNNER_TEMP/Gallery.xcresult" -only-testing:GalleryUITests test-without-building
          sips -g pixelWidth -g pixelHeight "$RUNNER_TEMP/ui-smoke.png"
          sips -g pixelWidth -g pixelHeight "$RUNNER_TEMP/ui-gallery-item.png"
      - name: Export UI test screenshots
        if: always()
        run: |
          if test -d "$RUNNER_TEMP/Gallery.xcresult"; then
            xcrun xcresulttool export attachments --path "$RUNNER_TEMP/Gallery.xcresult" --output-path "$RUNNER_TEMP/ui-test"
          fi
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: simulator-gallery
          path: |
            ${{ runner.temp }}/ui-*.png
            ${{ runner.temp }}/ui-test/*.png
            ${{ runner.temp }}/ui-test/manifest.json
          retention-days: 7
